    <script>
        let lastScrollTop = 0;
        const header = document.getElementById("mainHeader");
        window.addEventListener("scroll", function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > 50) { header.classList.add("header-opaco"); } 
            else { header.classList.remove("header-opaco"); }
            if (scrollTop > lastScrollTop && scrollTop > 100) { header.classList.add("header-oculto"); } 
            else { header.classList.remove("header-oculto"); }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        }, false);
    </script>
